name: CI de Pull Requests
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  api-validation:
    name: Validação da API
    uses: ./.github/workflows/ci.yml
