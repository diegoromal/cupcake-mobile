name: cupcake-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - cupcake_staging_postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  api:
    image: ${API_IMAGE:?required}
    environment: &api-env
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_REGION: ${S3_REGION-}
      S3_BUCKET: ${S3_BUCKET:?required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:?required}
    expose:
      - "3000"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(async r => { if (r.status !== 200 || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  admin:
    image: ${ADMIN_IMAGE:?required}
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      API_BASE_URL: ${API_BASE_URL:?required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?required}
    ports:
      - "10.60.60.30:3001:3001"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r => { if (r.status !== 200) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *logging

  migrate:
    image: ${OPS_IMAGE:?required}
    profiles: [ops]
    environment: *api-env
    command: ["npm", "run", "db:migrate:deploy"]
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

networks:
  app: {}
  data:
    internal: true

volumes:
  cupcake_staging_postgres_data:
    external: true
